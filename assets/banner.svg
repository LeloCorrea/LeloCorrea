<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="1" stop-color="#0b0f1a"/>
    </linearGradient>

    <radialGradient id="glow" cx="35%" cy="30%" r="65%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <g stroke="#00e5ff" stroke-opacity="0.18" fill="none">
    <ellipse cx="820" cy="140" rx="320" ry="110"/>
    <ellipse cx="820" cy="140" rx="220" ry="75"/>
    <ellipse cx="820" cy="140" rx="140" ry="48"/>
  </g>

  <g stroke="#00e5ff" stroke-opacity="0.35" stroke-width="2">
    <path d="M60 70 H220" />
    <path d="M60 70 V140" />
    <path d="M1220 250 H1060" />
    <path d="M1220 250 V180" />
  </g>

  <g filter="url(#softGlow)">
    <text x="70" y="150" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-size="56" fill="#00e5ff" font-weight="800" letter-spacing="1">Lelo Correa</text>
    <text x="70" y="190" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-size="22" fill="#c9d1d9" opacity="0.95">Senior Software Engineer • Designing reliable, high-impact systems</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#c9d1d9" opacity="0.9">
    <text x="70" y="240">STATUS: OPERATIONAL</text>
    <text x="70" y="262">FOCUS: BACKEND | CLOUD | DATA | AI</text>
  </g>

  <g fill="#00e5ff">
    <circle cx="1050" cy="96" r="3" opacity="0.8"/>
    <circle cx="980" cy="206" r="2.5" opacity="0.65"/>
    <circle cx="900" cy="140" r="2" opacity="0.5"/>
    <circle cx="1120" cy="156" r="2.5" opacity="0.6"/>
  </g>
</svg>
